name: on-schedule
run-name: On schedule

on:
  # run weekly: Mondays 06:00 UTC (midnight or 1 am in Texas)
  schedule:
    - cron: "0 6 * * 1"

  # run manually by user
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # only run on user instance of template, not template itself
    if: github.repository != 'greenelab/lab-website-template'
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit
    with:
      # commit new citations (including new Google Scholar papers) straight to main
      open-pr: false

  # rebuild and redeploy the site so the Publications page shows them;
  # a commit made by a workflow doesn't trigger the on-push build by itself
  build-site:
    needs: update-citations
    if: ${{ always() }}
    uses: ./.github/workflows/build-site.yaml
